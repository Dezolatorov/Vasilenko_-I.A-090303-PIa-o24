# LibraryAPI - Docker Compose (уровень A, базовый)
# Запуск: docker compose up --build
#
# Приложение и PostgreSQL запускаются одной командой. Секрет задаётся
# через переменную окружения SECRET_KEY (см. .env.example), значение
# по умолчанию предназначено только для локального запуска.

services:
  db:
    image: postgres:16-alpine
    container_name: library_api_db
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    volumes:
      - library-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://library:library@db:5432/library
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-0123456789abcdef}
      ACCESS_TOKEN_EXPIRE_MINUTES: "120"
      MAX_ACTIVE_LOANS: "5"
      LOAN_DAYS: "30"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  library-pgdata:
