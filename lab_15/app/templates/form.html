{% extends "base.html" %}
{% block title %}{% if mode == 'create' %}Новая книга{% else %}Редактирование{% endif %} — Библиотека{% endblock %}
{% block content %}
<h1>{% if mode == 'create' %}Новая книга{% else %}Редактирование книги{% endif %}</h1>

<form method="post" class="form">
    <label>Название
        <input type="text" name="title" value="{{ book.title or '' }}" required>
    </label>
    <label>Автор
        <select name="author_id" required>
            {% for author in authors %}
                <option value="{{ author.id }}" {% if book.author_id == author.id %}selected{% endif %}>{{ author.full_name }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Жанр
        <input type="text" name="genre" value="{{ book.genre or '' }}" required>
    </label>
    <label>Год
        <input type="number" name="year" min="1400" max="2100" value="{{ book.year or 2020 }}" required>
    </label>
    <label>ISBN
        <input type="text" name="isbn" value="{{ book.isbn or '' }}" required>
    </label>
    <label>Цена
        <input type="number" step="0.01" name="price" value="{{ book.price or 0 }}" required>
    </label>
    <label>Всего экземпляров
        <input type="number" name="copies_total" min="0" value="{{ book.copies_total or 1 }}" required>
    </label>
    <label>Доступно
        <input type="number" name="copies_available" min="0" value="{{ book.copies_available if book.copies_available is not none else 1 }}">
    </label>
    <button type="submit" class="button">Сохранить</button>
    <a class="button button--secondary" href="{{ url_for('web.books') }}">Отмена</a>
</form>
{% endblock %}
