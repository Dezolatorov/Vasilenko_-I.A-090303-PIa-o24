services:
  mongodb:
    image: mongo:7
    container_name: lab13-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    container_name: lab13-redis
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no

volumes:
  mongo_data:
