{% extends "base.html" %}
{% block title %}Читатели — Библиотека{% endblock %}
{% block content %}
<h1>Читатели</h1>
<table class="table">
    <thead><tr><th>ФИО</th><th>E-mail</th><th>Телефон</th><th>Выдач</th></tr></thead>
    <tbody>
    {% for reader in readers %}
        <tr>
            <td><a href="{% url 'library:reader_detail' reader.pk %}">{{ reader.full_name }}</a></td>
            <td>{{ reader.email }}</td>
            <td>{{ reader.phone|default:"—" }}</td>
            <td>{{ reader.loans.count }}</td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
